# gitleaks: the default rules, plus one allowlist entry. An EVM address (0x + exactly 40 hex chars, e.g. a token
# contract next to the word "token") is a public identifier and cannot be a secret. Private keys are 64 hex chars
# and are still caught.
title = "agentsettle-hsk"

[extend]
useDefault = true

[allowlist]
description = "EVM addresses are public"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
